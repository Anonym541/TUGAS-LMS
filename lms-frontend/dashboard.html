<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | LMS Kampus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-page">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="brand brand-light">
        <span class="brand-mark"><i data-lucide="graduation-cap"></i></span>
        <span>LMS<span class="brand-muted"> Kampus</span></span>
      </a>
      <div class="side-label">MENU UTAMA</div>
      <nav id="sideNav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon"><i data-lucide="headset"></i></div>
          <strong>Butuh bantuan?</strong>
          <p>Hubungi pengelola LMS jika mengalami kendala.</p>
          <a href="#" data-page="pengaturan">Pusat bantuan <i data-lucide="arrow-up-right"></i></a>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <i data-lucide="log-out"></i><span>Keluar dari akun</span>
        </button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Buka menu">
          <i data-lucide="menu"></i>
        </button>
        <div class="breadcrumb">
          <span>Workspace</span>
          <i data-lucide="chevron-right"></i>
          <strong id="breadcrumbCurrent">Dashboard</strong>
        </div>
        <div class="top-actions">
          <label class="top-search">
            <i data-lucide="search"></i>
            <input id="globalSearch" placeholder="Cari sesuatu...">
            <kbd>⌘ K</kbd>
          </label>
          <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifikasi">
            <i data-lucide="bell"></i><span></span>
          </button>
          <div class="top-divider"></div>
          <button class="profile-menu" id="profileMenu">
            <span class="avatar" id="topAvatar">GE</span>
            <span class="profile-text">
              <strong id="topName">Pengguna</strong>
              <small id="topRole">Mahasiswa</small>
            </span>
            <i data-lucide="chevron-down"></i>
          </button>
        </div>
      </header>

      <div class="content-wrap">
        <section id="pageContent"></section>
        <footer class="footer">
          <span>© 2026 LMS Kampus</span>
          <span>Learning Management System <b>•</b> Versi 1.0</span>
        </footer>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">
    <i data-lucide="check-circle-2"></i>
    <span id="toastText">Berhasil</span>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <div>
          <span class="eyebrow blue">LMS KAMPUS</span>
          <h3 id="modalTitle">Informasi</h3>
        </div>
        <button class="icon-btn" id="closeModal"><i data-lucide="x"></i></button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
